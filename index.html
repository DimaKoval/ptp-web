<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>PTP Share</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%237c5cff'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main id="stage" class="idle">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="screen"></canvas>

    <section id="status" class="status">
      <div class="status-card">
        <div class="logo" aria-hidden="true"><span></span></div>
        <div id="spinner" class="spinner" aria-hidden="true"></div>
        <h1 id="status-title">Connecting…</h1>
        <p id="status-detail">Looking for the host on the signaling relays.</p>
        <button id="retry" class="btn primary" hidden>Try again</button>
      </div>
    </section>

    <button id="unmute" class="unmute" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      Click to unmute
    </button>

    <div id="controls" class="controls" hidden>
      <div class="left">
        <span class="live-dot"></span><span class="live-label">LIVE</span>
        <span id="meta" class="meta"></span>
      </div>
      <div class="right">
        <button id="mute" class="icon-btn" title="Mute (m)">
          <svg id="ic-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
          <svg id="ic-muted" viewBox="0 0 24 24" hidden><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4v2.2l2.5 2.5V12zm2.5 0c0 .9-.2 1.8-.5 2.6l1.5 1.5A8.8 8.8 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1a7 7 0 0 1 5 6.7zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3c-.7.5-1.4.9-2.3 1.2v2.1a9 9 0 0 0 3.7-1.8l2 2 1.3-1.3L4.3 3zM12 4 9.9 6.1 12 8.2V4z"/></svg>
        </button>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        <button id="stats-btn" class="icon-btn" title="Stream info (i)">
          <svg viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg>
        </button>
        <button id="fullscreen" class="icon-btn" title="Fullscreen (f)">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>
    </div>

    <pre id="stats" class="stats" hidden></pre>
  </main>
  <script type="module" src="app.js?v=5"></script>
</body>
</html>
